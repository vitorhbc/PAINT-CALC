<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaintCalc Pro 2.0</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial;background:#eef;padding:12px} .c{max-width:1000px;margin:auto}.card{background:#fff;padding:12px;border-radius:10px;margin:10px 0}input,select,textarea{width:100%;padding:8px;margin:4px 0}button{padding:10px;background:#1565c0;color:#fff;border:0;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}</style></head><body><div class=c><h1>PaintCalc Pro 2.0</h1><div class=card><h3>Cliente</h3><input id=cli placeholder='Nome cliente'><input id=obra placeholder='Obra'></div><div class=card><h3>Divisão</h3><div class=row><input id=cmp placeholder='Comprimento'><input id=lar placeholder='Largura'><input id=alt placeholder='Altura'><button onclick='calc()'>Calcular</button></div><div class=row><input id=np value='1' placeholder='Portas'><input id=nj value='1' placeholder='Janelas'><input id=ppm value='17.5' placeholder='€/m²'><select id=iva><option>6</option><option selected>23</option></select></div><div class=row><input id=pl value='8' placeholder='€/L'><input id=dem value='2'><input id=rend value='10'><input id=marca placeholder='Marca tinta'></div></div><div class=card><textarea id=obs placeholder='Observações'></textarea><input type=file accept='image/*' capture='environment'></div><div class=card id=res>Resultado</div><div class=card><button onclick='save()'>Guardar histórico</button><button onclick='window.print()'>PDF/Imprimir</button></div><div class=card><h3>Histórico</h3><div id=h></div></div></div><script>function calc(){let c=+cmp.value,l=+lar.value,a=+alt.value;let area=((c*2+l*2)*a)+(c*l);let util=area-(+np.value*1.89)-(+nj.value*1.2);let litros=(util*+dem.value)/(+rend.value);let mo=util*+ppm.value;let mat=litros*+pl.value;let sub=mo+mat;let total=sub*(1+(+iva.value/100));window.last={cliente:cli.value,total:total,area:util};res.innerHTML=`Área útil: ${util.toFixed(2)} m²<br>Litros: ${litros.toFixed(1)}<br>Mão de obra: €${mo.toFixed(2)}<br>Material: €${mat.toFixed(2)}<br>Total c/ IVA: <b>€${total.toFixed(2)}</b>`;}function save(){let d=JSON.parse(localStorage.pc||'[]'); if(last){d.push(last); localStorage.pc=JSON.stringify(d);} load()}function load(){let d=JSON.parse(localStorage.pc||'[]'); h.innerHTML=d.map(x=>`${x.cliente} - ${x.area.toFixed(1)} m² - €${x.total.toFixed(2)}`).join('<hr>')}load();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script></body></html>
